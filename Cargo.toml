[package]
name = "kagnode-proxy-manager"
version = "5.0.5"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/every-lemon/kagnode-pm"
description = "A resource-conscious multi-server reverse and forward proxy manager"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["form", "json", "query", "ws"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.4"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
kagnode-core = { path = "vendor/core-rust", version = "5.0.10" }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ring = "0.17"
rusqlite = { version = "0.38", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "process", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
